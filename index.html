<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>現場チェックシート（記録ビデオ撮影者用）</title>
<style>
  body {
    font-family: sans-serif;
    background: #f5f5f5;
    padding: 20px;
    line-height: 1.6;
  }
  h1, h2 {
    margin-top: 40px;
  }
  .section {
    background: #fff;
    padding: 20px;
    border-radius: 8px;
    margin-bottom: 30px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.1);
  }
  table {
    width: 100%;
    border-collapse: collapse;
    margin-bottom: 20px;
  }
  table th, table td {
    border: 1px solid #ccc;
    padding: 8px;
  }
  label {
    display: block;
    margin: 10px 0;
  }
  textarea {
    width: 100%;
    height: 120px;
    padding: 8px;
  }
</style>
</head>
<body>

<h1>現場チェックシート / 記録ビデオ撮影者用</h1>

<div class="section">
  <h2>基本情報</h2>
  <table>
    <tr>
      <th>挙式日</th>
      <td colspan="2"><input type="text" name="kyoshiki" style="width: 95%;"></td>
      <th>ご両家名</th>
      <td><input type="text" name="goryoke" style="width: 95%;"></td>
    </tr>
    <tr>
      <td>会場名</td>
      <td><input type="text" name="kaijo" style="width: 95%;"></td>
      <td>挙式会場</td>
      <td>挙式時間</td>
      <td><input type="text" name="jikoku" style="width: 95%;"></td>
    </tr>
    <tr>
      <td>撮影範囲</td>
      <td colspan="2">
        <label><input type="checkbox" class="jizen" value="式のみ"> 式のみ</label>
        <label><input type="checkbox" class="jizen" value="宴のみ"> 宴のみ</label>
        <label><input type="checkbox" class="jizen" value="式＋宴"> 式＋宴</label>
